version: 1
# Example Meltano project used by the meltano-sit RunnerITCase to exercise
# cloning a dbt package dependency over HTTPS with an embedded credential.
#
# The pipeline below runs `dbt deps`, which clones the git package declared in
# transform/packages.yml. That package is PRIVATE and is cloned over
# https://oauth2:<token>@github.com/... — the exact path that regressed under
# MEL-403 when the platform GitHub extraHeader was injected into pipeline stages
# and overrode the per-repo token (GitHub then returns "Repository not found").
#
# Required at run time (see README.md):
#   DBT_ENV_SECRET_GIT_TOKEN - a token with read access to the private package repo
send_anonymous_usage_stats: false
project_id: fd5a56d0-e6d2-4ad0-9a4e-a41cc75d6462
default_environment: staging

# Pass the dbt git token through to the task environment so that the
# {{ env_var('DBT_ENV_SECRET_GIT_TOKEN') }} reference in transform/packages.yml
# resolves. The value must be present in the pipeline's run environment.
env:
  DBT_ENV_SECRET_GIT_TOKEN: ${DBT_ENV_SECRET_GIT_TOKEN}

environments:
- name: staging

plugins:
  utilities:
  # The plugin is fully SELF-DESCRIBED inline (executable + namespace + commands).
  # This is required: DataComponentLoader only creates a workspace data component
  # for a plugin that is self-described (or already installed). A bare
  # `name: dbt-postgres` + `variant: dbt-labs` reference is skipped at deploy time,
  # so the pipeline's `dbt-postgres` data component would not exist and validation
  # fails with "Data component 'dbt-postgres' does not exist ...".
  # Mirrors registry def plugins/utilities/dbt-postgres--dbt-labs.yml.
  - name: dbt-postgres
    namespace: dbt_postgres
    variant: dbt-labs
    executable: dbt_invoker
    pip_url: dbt-core~=1.3.0 dbt-postgres~=1.3.0 git+https://github.com/meltano/dbt-ext.git@main
    settings:
    - name: skip_pre_invoke
      env: DBT_EXT_SKIP_PRE_INVOKE
      kind: boolean
      value: true
    - name: type
      env: DBT_EXT_TYPE
      value: postgres
    - name: project_dir
      env: DBT_PROJECT_DIR
    - name: profiles_dir
      env: DBT_PROFILES_DIR
    config:
      # skip_pre_invoke=true keeps `dbt deps` from opening a warehouse connection,
      # so the run exercises only the credentialed HTTPS package clone.
      skip_pre_invoke: true
      project_dir: $MELTANO_PROJECT_ROOT/transform
      profiles_dir: $MELTANO_PROJECT_ROOT/transform/profile
    commands:
      deps:
        args: deps
        description: Pull the most recent version of the dependencies listed in packages.yml
      run:
        args: run
        description: Compile SQL and execute against the current target database.
      compile:
        args: compile
        description: Generates executable SQL from source, model, test, and analysis files.
      test:
        args: test
        description: Runs tests on data in deployed models.
      seed:
        args: seed
        description: Load data from csv files into your data warehouse.
      debug:
        args: debug
        description: Debug your dbt project and warehouse connection.

jobs:
# `dbt deps` resolves and clones the dependencies in transform/packages.yml.
# This is the minimal action that exercises the credentialed HTTPS clone without
# requiring a populated warehouse.
- name: dbt-deps-job
  tasks:
  - dbt-postgres:deps

schedules:
# The schedule name is surfaced by the platform as the runnable pipeline name and
# is referenced by the SIT runner YAML (pipeline.name: dbt-https-deps).
- name: dbt-https-deps
  job: dbt-deps-job
  interval: '@once'
