# dbt package dependency cloned over HTTPS with embedded credentials.
#
# The credentials below are ARBITRARY and intentionally invalid — this fixture
# does not need a real token or a real private repo. The point of the test is to
# reproduce an HTTPS git clone from a pipeline/dbt task and prove the embedded
# credentials reach GitHub *unchanged* (i.e. the platform does not inject an
# overriding http.extraHeader, as it wrongly did under the MEL-403 regression).
#
# Expected outcome: GitHub rejects these credentials with "Authentication failed"
# — which proves they were the credentials actually sent. The SIT asserts that
# message and expects the job to error (see the runner YAML). If the platform
# overwrote the auth with its own token, GitHub would instead return a different
# result (success, or "Repository not found"), and the test would fail.
#
# Do NOT replace these with real credentials.
packages:
  - git: "https://sit-user:sit-not-a-real-token@github.com/Matatika/sit-dbt-https-marker.git"
    revision: main
