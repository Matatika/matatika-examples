# dbt package dependency cloned over HTTPS with an embedded credential.
#
# This mirrors the customer scenario from the MEL-403 regression: a PRIVATE
# package fetched via https://oauth2:<token>@github.com/... . The token is
# supplied at run time via the DBT_ENV_SECRET_GIT_TOKEN environment variable
# (dbt masks any env var prefixed DBT_ENV_SECRET_ in logs).
#
# IMPORTANT (fixture the SIT owner must provide):
#   - Replace the repo below with a PRIVATE dbt package repo that the
#     DBT_ENV_SECRET_GIT_TOKEN can read but the platform GitHub App CANNOT.
#     This is what makes the test a genuine regression guard: under the bug the
#     platform extraHeader overrides the token and GitHub returns 404.
#   - The target repo must be a valid dbt package (contains a dbt_project.yml).
packages:
  - git: "https://oauth2:{{ env_var('DBT_ENV_SECRET_GIT_TOKEN') }}@github.com/Matatika/sit-dbt-private-package.git"
    revision: main
